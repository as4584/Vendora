name: Secret scan

# Fails the PR if a credential (API key, private key, token) is committed.
# Runs on every PR so it can be a required check.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan commits in this change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA" 2>/dev/null \
             && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            gitleaks git --redact --no-banner --log-opts="$BASE_SHA..HEAD" .
          else
            gitleaks git --redact --no-banner .
          fi
