name: Mutation tests

# Mutation testing: plant small bugs (flip a > to >=, drop a rounding step,
# swap + and -) in the money and inventory math and check a test fails for
# each one. Surviving mutants are bugs our tests would not notice.
#
# Not a required check: it runs weekly, on demand, and on PRs that touch the
# mutated files. Reports are uploaded as artifacts.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"
  pull_request:
    branches: [main]
    paths:
      - "backend/app/services/checkout.py"
      - "backend/app/services/profit.py"
      - "backend/setup.cfg"
      - "mobile/utils/checkout.ts"
      - "mobile/utils/inventory.ts"
      - "mobile/utils/inventorySort.ts"
      - "mobile/services/profit.ts"
      - "mobile/stryker.config.json"
      - ".github/workflows/mutation.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        working-directory: mobile
        run: npm ci --legacy-peer-deps
      - name: Stryker (fails under 60% mutation score)
        working-directory: mobile
        run: npx stryker run --concurrency 2
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-mutation-report
          path: mobile/reports/mutation/

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: vendora
          POSTGRES_PASSWORD: vendora
          POSTGRES_DB: vendora_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://vendora:vendora@localhost:5433/vendora_test
      TEST_DATABASE_URL: postgresql://vendora:vendora@localhost:5433/vendora_test
      SECRET_KEY: ci-test-secret-key
      ENVIRONMENT: testing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt "mutmut>=3,<4"
      - name: mutmut
        working-directory: backend
        run: |
          mutmut run --max-children 2 || true
          mutmut results --all true > mutmut-results.txt || true
          grep -E ": survived" mutmut-results.txt || echo "No surviving mutants."
          # Score gate: killed / (killed + survived) must stay >= 60%.
          killed=$(grep -cE ": killed" mutmut-results.txt || true)
          survived=$(grep -cE ": survived" mutmut-results.txt || true)
          total=$((killed + survived))
          echo "killed=$killed survived=$survived"
          test "$total" -gt 0
          test $((100 * killed / total)) -ge 60
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-mutation-results
          path: backend/mutmut-results.txt
