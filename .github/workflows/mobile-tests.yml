name: Mobile — Test & Deploy

# Runs on every push/PR so it can be a required status check; the `changes`
# job skips the mobile jobs when nothing under mobile/ changed (skipped jobs
# count as passing for branch protection).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPO_TOKEN: ${{ secrets.EXPO_DEV_ACCESS_TOKEN }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.diff.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect mobile changes
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # New branch or missing base → run everything.
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" "$GITHUB_SHA" | grep -qE '^(mobile/|\.github/workflows/mobile-tests\.yml$)'; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile=false" >> "$GITHUB_OUTPUT"
          fi

  # ── iPhone smoke tests (Expo web build + Playwright) ──────────────────────
  iphone-smoke:
    name: iPhone Smoke Tests
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install deps
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Typecheck application
        working-directory: mobile
        run: npm run typecheck

      - name: Run unit tests
        working-directory: mobile
        run: npm run test:ci

      - name: Build Expo web
        working-directory: mobile
        run: npm run build:web

      - name: Install Playwright + browser
        working-directory: mobile
        run: |
          npx playwright install --with-deps chromium

      - name: Run iPhone smoke tests
        working-directory: mobile
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-playwright-report
          path: mobile/playwright-report

  # ── OTA → preview (internal testers), automatic ────────────────────────────
  # Only on push to main, only if smoke tests pass.
  publish-preview:
    name: Publish OTA → preview Channel
    runs-on: ubuntu-latest
    needs: iphone-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install deps
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Publish OTA update
        working-directory: mobile
        run: |
          eas update \
            --channel preview \
            --message "ci: ${{ github.event.head_commit.message }}" \
            --non-interactive

  # ── OTA → production (store builds), requires approval ─────────────────────
  # The `production` environment must have a required reviewer configured in
  # Settings → Environments, otherwise this job runs without waiting.
  publish-production:
    name: Publish OTA → production Channel
    runs-on: ubuntu-latest
    needs: publish-preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install deps
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Publish OTA update
        working-directory: mobile
        run: |
          eas update \
            --channel production \
            --message "ci: ${{ github.event.head_commit.message }}" \
            --non-interactive
