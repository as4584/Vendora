version: 2
updates:
  # Mobile app. Native packages must move together with the Expo SDK (and a new
  # TestFlight build), so Dependabot only proposes patch/minor bumps for them;
  # SDK upgrades are done deliberately with `npx expo install --fix`.
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      mobile-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Anything compiled into the TestFlight binary moves only with an SDK
      # upgrade + new build, never via Dependabot: even native patch bumps would
      # be shipped over the air as JS to binaries built against the old version.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-community/*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "@react-navigation/*"
      - dependency-name: "react-test-renderer"
      # Tooling versioned with the SDK.
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@testing-library/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # SQLAlchemy 2.1 switches postgresql:// to psycopg 3; we run psycopg2.
      - dependency-name: "sqlalchemy"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # bcrypt 5 breaks passlib 1.7.
      - dependency-name: "bcrypt"
        update-types: ["version-update:semver-major"]
      # Stripe majors change object/API shapes; upgrade deliberately with live-mode testing.
      - dependency-name: "stripe"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
