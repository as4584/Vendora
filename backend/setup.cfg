# Mutation testing (mutmut 3, Linux/WSL/CI only — it needs fork()).
# Run: mutmut run && mutmut results   (see .github/workflows/mutation.yml)
[mutmut]
paths_to_mutate=
    app/services/checkout.py
    app/services/profit.py
tests_dir=tests/
also_copy=
    app/
    alembic/
    alembic.ini
    check_db.py
    create_user.py
    init_db.py
    reset_management_password.py
    seed_dev.py
    setup_db.py
pytest_add_cli_args_test_selection=
    tests/test_checkout_essentials.py
    tests/test_profit_engine.py
    tests/test_small_edge_completion.py
    tests/test_sale_orders.py
    tests/test_dashboard.py
