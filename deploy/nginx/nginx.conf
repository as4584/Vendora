# Load balancer in front of the API replicas (docker-compose.prod.yml).
# The Cloudflare tunnel reaches this container as "vendora-backend"; nginx
# spreads requests across every healthy `backend` replica.
worker_processes auto;
worker_rlimit_nofile 65536;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 16384;
}

http {
    # Docker's DNS; re-resolved so scaled or restarted replicas join the pool.
    resolver 127.0.0.11 valid=10s ipv6=off;

    access_log off;
    server_tokens off;
    client_max_body_size 55m;      # matches HardeningMiddleware's limit
    client_body_buffer_size 1m;

    upstream api {
        zone api 64k;
        least_conn;
        server backend:8000 resolve max_fails=3 fail_timeout=10s;
        keepalive 128;
    }

    server {
        listen 8000;

        location = /nginx-health {
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # CF-Connecting-IP passes through untouched; the rate limiter keys on it.
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            # Retry idempotent requests on another replica if one dies mid-deploy.
            # Not on 503: that is a busy replica shedding load (request_limit.py);
            # retrying would double the load and eject healthy replicas.
            proxy_next_upstream error timeout http_502;
            proxy_next_upstream_tries 2;
            proxy_request_buffering off;
        }
    }
}
